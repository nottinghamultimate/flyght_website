<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Flyght Club - Nottingham Ultimate Frisbee</title>
  <meta name="description" content="Flyght Ultimate is a friendly and competitive Ultimate club in Nottingham, welcoming players of all experience levels.">
  <!-- Load the Orbitron fallback font from Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@300;400;500;700&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="assets/flyght_favicon.png">
  <link rel="stylesheet" href="assets/style.css">
  <link rel="stylesheet" href="css/responsive.css">
  <style>
    :root { --site-header-height: 64px; }

    /* Sticky header */
    header {
      position: sticky;
      top: 0;
      z-index: 9999;
      width: 100%;
      background: var(--dark-green);
      -webkit-backdrop-filter: blur(6px);
      backdrop-filter: blur(6px);
      color: var(--white);
      overflow: visible;
    }

    /* Header inner layout */
    .header-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding: 0 .75rem;
      min-height: 64px;
    }

    #page-content { padding-top: 20px; transition: padding-top .12s; }

    /* Desktop nav */
    .site-nav {
      display: flex;
      gap: 1rem;
      align-items: center;
      position: relative;
    }
    .site-nav a,
    .nav-dropdown-toggle,
    .submenu-toggle,
    .mobile-back-btn {
      display: inline-flex;
      align-items: center;
      gap: .35rem;
      padding: .5rem .4rem;
      text-decoration: none;
      color: var(--white);
      background: transparent;
      border: 0;
      cursor: pointer;
      font: inherit;
    }
    .site-nav a:hover,
    .site-nav a:focus,
    .nav-dropdown-toggle:hover,
    .nav-dropdown-toggle:focus,
    .submenu-toggle:hover,
    .submenu-toggle:focus {
      color: #0b62a4;
    }

    .mobile-back-btn { display: none; }

    /* Desktop flyouts */
    @media (min-width: 769px) {
      .nav-dropdown, .submenu { position: relative; }

      .dropdown-menu, .submenu-menu {
        display: none;
        position: absolute;
        background: var(--dark-green);
        box-shadow: 0 12px 24px rgba(0,0,0,.12);
        border: 1px solid rgba(255,255,255,.12);
        z-index: 3000;
        text-align: center;
        min-width: 220px;
      }

      .nav-dropdown.is-open > .dropdown-menu,
      .submenu.is-open > .submenu-menu {
        display: block;
      }

      .dropdown-menu {
        top: calc(100% + .5rem);
        left: 50%;
        transform: translateX(-50%);
      }

      .submenu-menu {
        top: 0;
        left: 100%;
      }

      .dropdown-menu a, .submenu-menu a {
        display: block;
        padding: .7rem .9rem;
        color: var(--white);
        text-decoration: none;
        white-space: nowrap;
      }

      .dropdown-menu a:hover, .submenu-menu a:hover {
        background: rgba(255,255,255,.06);
      }
    }

    /* Nav toggle (hidden on desktop) */
    .nav-toggle { display: none; background: transparent; border: none; font-size: 1.25rem; line-height:1; padding: .5rem; cursor: pointer; color: var(--white); }

    /* Mobile drill-down styles */
    @media (max-width: 768px) {
      .nav-toggle { display: inline-flex; align-items:center; justify-content:center; }

      .site-nav { 
        display: none;
        position: absolute;
        top: var(--site-header-height);
        left: 0;
        right: 0;
        height: calc(100vh - var(--site-header-height));
        background: var(--dark-green);
        overflow-x: hidden;
        overflow-y: auto;
        flex-direction: column;
        align-items: stretch;
        padding: 1rem 0;
      }

      header.mobile-menu-open .site-nav {
        display: flex;
      }

      .site-nav a,
      .nav-dropdown-toggle,
      .submenu-toggle,
      .mobile-back-btn {
        width: 100%;
        justify-content: center;
        padding: .85rem 1rem;
        border-bottom: 1px solid rgba(255,255,255,.05);
      }

      .mobile-back-btn {
        display: flex;
        font-weight: bold;
        background: rgba(255,255,255,.08);
        margin-bottom: .5rem;
      }

      .nav-dropdown, .submenu { width: 100%; }

      /* Drill-down subpanels replace the main menu layer */
      .dropdown-menu,
      .submenu-menu {
        display: none;
        flex-direction: column;
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: var(--dark-green);
        z-index: 10;
        padding-top: .5rem;
      }

      .dropdown-menu.is-active,
      .submenu-menu.is-active {
        display: flex;
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="header-inner">
      <a class="logo-link" href="#home">
        <img src="assets/flyght_logo.png" alt="Flyght logo">
      </a>

      <!-- mobile toggle placed next to nav for consistent layout -->
      <button class="nav-toggle" aria-expanded="false" aria-label="Open menu">&#9776;</button>

      <nav class="site-nav" aria-label="Primary">
        <a href="#home">Home</a>
        <a href="#what-is-ultimate">What is Ultimate</a>
        <a href="#news">News</a>

        <div class="nav-dropdown">
          <button class="nav-dropdown-toggle" type="button" aria-expanded="false" aria-controls="documents-menu">
            Documents
            <span aria-hidden="true">▾</span>
          </button>

          <div class="dropdown-menu" id="documents-menu">
            <button class="mobile-back-btn" type="button">‹ Back to Main Menu</button>
            <a href="https://drive.google.com/file/d/1uPKgdUqGEGW1LogIJfakLPsnRqyOoMxv/view?usp=sharing" target="_blank" rel="noreferrer">Constitution</a>
            <a href="https://docs.google.com/document/d/1OYPpQA5snKfEvhyE-Mx7YVahZtwt8gbQ/edit?usp=sharing&ouid=114909020403936945939&rtpof=true&sd=true" target="_blank" rel="noreferrer">Code of Conduct</a>
            <a href="https://docs.google.com/document/d/1wbTFdiutQtIMlZPYGVbkhPbYCXFdkA-jliou547xljs/edit?usp=sharing" target="_blank" rel="noreferrer">Payment Policy</a>

            <div class="submenu">
              <button class="submenu-toggle" type="button" aria-expanded="false" aria-controls="consent-forms-menu">
                Consent Forms
                <span aria-hidden="true">▸</span>
              </button>

              <div class="submenu-menu" id="consent-forms-menu">
                <button class="mobile-back-btn" type="button">‹ Back to Documents</button>
                <a href="https://docs.google.com/document/d/1GQ5w6_PeaOvYl5ftMpekJBpE9bzsjWaS/edit?usp=sharing&ouid=106295498390520346344&rtpof=true&sd=true" target="_blank" rel="noreferrer">Junior Consent - Annual</a>
                <a href="https://docs.google.com/document/d/16aAkZiBRsvql2uosm2jpwxEXit15tn0E/edit?usp=sharing&ouid=106295498390520346344&rtpof=true&sd=true" target="_blank" rel="noreferrer">Junior Consent - Event</a>
                <a href="https://docs.google.com/document/d/16qIf0ve4XS3eCqg_n-22V6517NC4l_Su/edit?usp=sharing&ouid=106295498390520346344&rtpof=true&sd=true" target="_blank" rel="noreferrer">Junior Consent - Training</a>
                <a href="https://docs.google.com/document/d/1Dkk0knt7kHE7bXsuizjCEFF9v-ILul9D/edit?usp=sharing&ouid=106295498390520346344&rtpof=true&sd=true" target="_blank" rel="noreferrer">Junior Consent - Event (non-Flyght)</a>
              </div>
            </div>
          </div>
        </div>

        <a href="#contact">Contact</a>
      </nav>
    </div>
  </header>

  <main id="page-content">
    <p>Loading content…</p>
  </main>

  <!-- Header height and main toggle script -->
  <script>
    (function () {
      const header = document.querySelector('header');
      if (!header) return;
      const toggle = header.querySelector('.nav-toggle');

      function setHeaderHeightVar() {
        const h = header.getBoundingClientRect().height || 64;
        document.documentElement.style.setProperty('--site-header-height', Math.ceil(h) + 'px');
      }
      
      window.addEventListener('load', setHeaderHeightVar);
      setHeaderHeightVar();
      window.addEventListener('resize', setHeaderHeightVar);

      if (!toggle) return;
      toggle.addEventListener('click', function (e) {
        e.stopPropagation();
        const open = header.classList.toggle('mobile-menu-open');
        toggle.setAttribute('aria-expanded', open ? 'true' : 'false');
        toggle.setAttribute('aria-label', open ? 'Close menu' : 'Open menu');
        if (!open) closeAllSubpanels();
        requestAnimationFrame(setHeaderHeightVar);
      });

      header.querySelectorAll('.site-nav a').forEach(link => {
        link.addEventListener('click', function () {
          if (window.innerWidth > 768) return;
          header.classList.remove('mobile-menu-open');
          toggle.setAttribute('aria-expanded', 'false');
          toggle.setAttribute('aria-label', 'Open menu');
          closeAllSubpanels();
          requestAnimationFrame(setHeaderHeightVar);
        });
      });

      document.addEventListener('click', function (e) {
        if (!header.classList.contains('mobile-menu-open')) return;
        if (header.contains(e.target)) return;
        header.classList.remove('mobile-menu-open');
        toggle.setAttribute('aria-expanded', 'false');
        toggle.setAttribute('aria-label', 'Open menu');
        closeAllSubpanels();
        requestAnimationFrame(setHeaderHeightVar);
      });
    })();
  </script>

  <!-- Drill-down & dropdown handler script -->
  <script>
    function closeAllSubpanels() {
      document.querySelectorAll('.dropdown-menu, .submenu-menu').forEach(menu => {
        menu.classList.remove('is-active');
      });
      document.querySelectorAll('.nav-dropdown, .submenu').forEach(container => {
        container.classList.remove('is-open');
      });
      document.querySelectorAll('.nav-dropdown-toggle, .submenu-toggle').forEach(btn => {
        btn.setAttribute('aria-expanded', 'false');
      });
    }

    // Toggle dropdowns & mobile drill-downs
    document.querySelectorAll('.nav-dropdown-toggle, .submenu-toggle').forEach(button => {
      button.addEventListener('click', function (e) {
        e.stopPropagation();
        const menu = this.nextElementSibling;
        if (!menu) return;

        if (window.innerWidth <= 768) {
          menu.classList.add('is-active');
        } else {
          const container = this.closest('.nav-dropdown, .submenu');
          const isOpen = container.classList.contains('is-open');
          if (container.classList.contains('nav-dropdown')) closeAllSubpanels();
          container.classList.toggle('is-open', !isOpen);
          this.setAttribute('aria-expanded', String(!isOpen));
        }
      });
    });

    // Mobile back button triggers
    document.querySelectorAll('.mobile-back-btn').forEach(button => {
      button.addEventListener('click', function (e) {
        e.stopPropagation();
        const currentPanel = this.closest('.dropdown-menu, .submenu-menu');
        if (currentPanel) {
          currentPanel.classList.remove('is-active');
        }
      });
    });

    // Close desktop flyouts when clicking outside
    document.addEventListener('click', function (e) {
      if (window.innerWidth > 768 && !e.target.closest('.nav-dropdown, .submenu')) {
        closeAllSubpanels();
      }
    });
  </script>

  <!-- Original section loader script -->
  <script>
    const sectionMap = {
      home: 'sections/Home.html',
      'what-is-ultimate': 'sections/What is Ultimate.html',
      news: 'sections/News.html',
      contact: 'sections/Contact.html'
    };

    async function loadSection(sectionId) {
      const pageContent = document.getElementById('page-content');
      const filePath = sectionMap[sectionId] || sectionMap.home;
      try {
        const response = await fetch(filePath);
        if (!response.ok) throw new Error('Failed to load ' + filePath);
        const html = await response.text();
        pageContent.innerHTML = html;
      } catch (error) {
        console.error(error);
        pageContent.innerHTML = '<p>Unable to load this section. Please try again later.</p>';
      }
    }

    function loadCurrentSection() {
      const currentHash = window.location.hash.slice(1) || 'home';
      loadSection(currentHash);
    }

    window.addEventListener('hashchange', loadCurrentSection);
    window.addEventListener('DOMContentLoaded', loadCurrentSection);
  </script>
</body>
</html>
